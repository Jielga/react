name: Close Issues

# GitHub honours closing keywords only on a pull request into the default
# branch. The default branch is `public` and pull requests target `main`, so
# this job reads the same keywords from the description of a merged pull request.
#
# It runs on pull_request_target because a fork's pull_request token cannot write
# to issues. It checks out no code, and the description reaches the shell through
# an environment variable, so a pull request can only supply issue numbers.

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Close the issues the description names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf '%s\n' "$PR_BODY" \
            | grep -ioE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' \
            | sort -un \
            | while read -r issue; do
                gh issue close "$issue" --reason completed --comment "Closed by #${PR_NUMBER}."
              done
